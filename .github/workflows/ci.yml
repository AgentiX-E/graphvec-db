# ============================================================
# CI/CD: Continuous Integration Workflow
# File: .github/workflows/ci.yml
# Description: 自动化测试、Lint 检查、安全审计、覆盖率报告
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # ============================================================
  # Job 1: Test — 运行 Jest 全量测试
  # ============================================================
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm run test:all
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # ============================================================
  # Job 2: Lint — TypeScript 类型检查
  # ============================================================
  lint:
    name: Lint (TypeScript Check)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (tsc --noEmit)
        run: npx tsc --noEmit

  # ============================================================
  # Job 3: Security — npm audit + lockfile 校验
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lockfile integrity verification
        run: node scripts/verify-deps.mjs

  # ============================================================
  # Job 4: Coverage — 覆盖率报告生成
  # ============================================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (jest.no-coverage.config.ts)
        run: npx jest --config jest.no-coverage.config.ts --coverage --coverageDirectory coverage --forceExit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
