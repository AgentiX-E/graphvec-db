# ============================================================
# CI/CD: Continuous Integration Workflow
# File: .github/workflows/ci.yml
# Description: Automated testing, linting, type checking,
#              and coverage reporting using Vitest
# ============================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  # onnxruntime-node postinstall downloads CUDA GPU binaries from nuget.org,
  # which is a network-fragile step on shared CI runners (ETIMEDOUT/ENETUNREACH).
  # Tests only need the bundled CPU binaries, so skip the CUDA download.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # ============================================================
  # Job 1: Test (Unit) — 功能性单元测试（串行、无重负载）
  # ============================================================
  # The suite is partitioned into three tiers so each job stays bounded and
  # deterministic on shared CI runners:
  #   - Unit:  default config (vmThreads, serial), excludes benchmark/ZMQ/fs/onnx
  #   - Slow:  ZMQ-heavy specs that spawn child processes (must run serially)
  #   - Data:  filesystem-bound specs that contend over ./test-data/ (serial)
  test-unit:
    name: Test Unit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20.x, 22.x]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (vitest)
        run: npx vitest run --config vitest.config.ts --root .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-unit-results-${{ matrix.node-version }}
          path: |
            test-results/
            **/__snapshots__/
          retention-days: 7

  # ============================================================
  # Job 1b: Test (Slow) — ZMQ-heavy 串行测试
  # ============================================================
  test-slow:
    name: Test Slow (ZMQ)
    runs-on: ubuntu-latest
    # The slow suite runs 12 ZMQ-heavy specs serially (single worker). A full
    # local run measures ~19 minutes of pure test time; npm ci and runner
    # provisioning add another ~2-3 minutes, so 20 minutes is right at the
    # edge and causes spurious cancellations on shared runners. 35 minutes
    # leaves a healthy safety margin.
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ZMQ-heavy tests (serial)
        run: npx vitest run --config vitest.slow.config.ts --root .

  # ============================================================
  # Job 1c: Test (Data) — filesystem-bound 串行测试
  # ============================================================
  test-data:
    name: Test Data (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run filesystem-bound tests (serial)
        run: npx vitest run --config vitest.data.config.ts --root .

  # ============================================================
  # Job 2: Lint — ESLint 代码风格检查
  # ============================================================
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint check
        run: npm run lint

  # ============================================================
  # Job 3: TypeScript Type Check
  # ============================================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (tsc --noEmit)
        run: npx tsc --noEmit

  # ============================================================
  # Job 4: Security — npm audit + 依赖完整性校验
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Verify dependency integrity
        run: npm run verify-deps

  # ============================================================
  # Job 5: Coverage — Vitest 覆盖率报告
  # ============================================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (vitest)
        run: npx vitest run --config vitest.config.ts --root . --coverage
        env:
          # The full suite + v8 coverage exceeds the previous 4 GiB heap cap and
          # crashed with a JavaScript OOM (exit 134). Raise to 8 GiB so the
          # coverage pass completes on the shared runner.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
